name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Dev dependencies (svelte-check, vitest, vite) must install even if the
      # runner sets NODE_ENV=production. The lockfile still pins every version.
      - run: npm ci --include=dev
      - run: npm run check
      - run: npm run test:run
      - run: npm run build

  ai-review:
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Grok review
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/ai-review.mjs
